syntax = "proto3";
package krun.runtime.v2;

// Each binary WebSocket message is a Frame. Oversize server frames are split
// into bounded chunk frames and assembled before decoding/installing anything.
message Ref {
  string kind = 1;
  string id = 2;
  string incarnation = 3;
  uint64 generation = 4;
}
message Resource {
  Ref version = 1;
  bool deleted = 2;
  // One typed business entity, using its existing public JSON descriptor.
  bytes payload_json = 3;
  repeated Ref dependencies = 4;
}
message Frame {
  string type = 1;
  uint64 request_id = 2;
  string epoch = 3;
  string pod_uid = 4;
  repeated Ref refs = 5;
  repeated Resource resources = 6;
  string error = 7;
  int64 confirmed_unix_millis = 8;
  bool fresh = 9;
  uint32 part = 10;
  uint32 parts = 11;
  bytes chunk = 12;
  uint64 nonce = 13;
  bool applied = 14;
}
