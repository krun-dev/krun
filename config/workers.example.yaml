# 在 Kubernetes 中运行的 Workers 控制面配置示例。
# 仓库来源与登录 providers 独立；修改配置后重启控制面。
listen: 127.0.0.1:8080
public_url: http://127.0.0.1:4380
development: true
db: ${KRUN_DATABASE_URL}
providers:
  - id: local
    source_id: workers-development
    type: dev
    name: 开发登录
workers:
  namespace: workers-mvp
  builder_image: krun-worker-builder:20261013
  builder_pull_policy: Never
  runtime_service: runtime-default
  gateway_name: workers-mvp
  gateway_namespace: kgateway-system
  domain: workers.test
  preview_limit: 32 # 每个服务可并存的预览环境上限（1-128，默认 32）。
  runtime_token: ${KRUN_RUNTIME_TOKEN}
  management_token: ${KRUN_MANAGEMENT_TOKEN}
  s3_endpoint: http://minio:9000
  s3_bucket: krun-artifacts
  s3_location_id: primary
  s3_access_key: ${KRUN_S3_ACCESS}
  s3_secret_key: ${KRUN_S3_SECRET}
  repository_providers:
    - id: company-gitlab
      type: gitlab
      name: 公司 GitLab
      enabled: true
      priority: 10 # 数字越小越靠前；相同时按 id 排序。
      base_url: https://gitlab.example.internal
      token: ${KRUN_GITLAB_REPOSITORY_TOKEN:-}
      # 有共享 Token 时必须明确配置允许读取的仓库；填写真实 namespace/name。
      allowed_repositories:
        - team/worker-service
      # 可选：限定哪些平台组织能够使用此来源。
      # organization_ids: [org_example]
    - id: github
      type: github
      name: GitHub
      enabled: true
      priority: 20
      base_url: https://github.com
      # 公开仓库不需要 Token。私有仓库同样需要 Token 和 allowed_repositories。
      # token: ${KRUN_GITHUB_REPOSITORY_TOKEN:-}
      # allowed_repositories: [team/worker-service]
    - id: gitlab
      type: gitlab
      name: GitLab.com
      enabled: false
      priority: 30
      base_url: https://gitlab.com
