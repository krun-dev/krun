# 本地开发配置模板。实际开发配置只有一份：.data/dev.yaml（gitignored）。
# 从本模板复制后填写真实值：cp config/development.example.yaml .data/dev.yaml
# 本地开发拓扑：控制面/Postgres/MinIO/builder 跑在开发机；集群只跑 serving runtime、
# 独立 validator workerd 与 kgateway。完整 workers: 配置见 config/example.yaml。
listen: 127.0.0.1:8080
public_url: http://127.0.0.1:8080
development: true
# 允许任何已登录用户创建组织（默认 false：仅系统管理员）
organization_self_service: false
db: postgres://krun:CHANGE_ME@127.0.0.1:25432/krun_dev?sslmode=disable
static_dir: dist
trusted_proxy_cidrs: []
providers:
  - id: local
    enabled: true # 改为 false 禁用本地开发登录
    source_id: local-development
    type: dev
    name: 本地开发登录
  # 接入真实 SSO 时参考 config/example.yaml；Workers 与认证配置同文件，完整 workers: 段见 config/example.yaml。
  # local-first 的 s3_endpoint / s3_builder_endpoint 通常使用本机 127.0.0.1；
  # s3_runtime_endpoint 必须改成集群可达且已加入 workerd allowlist 的开发机 MinIO 地址。
  # S3 兼容存储：s3_addressing_style 可选 auto/path/virtual，region 使用服务提供的签名区域。
  # 私有读取用 s3_access_mode: signed；已有桶用 s3_bucket_mode: external，两项独立。
  # 本地 MinIO 可用 managed + direct；同样支持 external + signed。
  # npm_registry 必须是无内嵌凭据的 HTTPS registry / 公司 npm proxy；默认 https://registry.npmjs.org/。
  # Secrets 还需在同一 workers: 段配置 secrets_active_key 与 secrets_keys；
  # 真实 key 只放 .data/dev.yaml 或由其中的环境变量占位符展开。
  # 业务存储凭据同样放 workers.object_storage，与制品的 s3_* 配置分开。
  # object_storage:
  #   default_store: local
  #   cursor_key: ${KRUN_OBJECT_STORAGE_CURSOR_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
  #   request_timeout_seconds: 600
  #   stores:
  #     - id: local
  #       endpoint: http://127.0.0.1:9000
  #       region: us-east-1
  #       bucket: example-worker-data
  #       root_prefix: worker-data/v1
  #       addressing_style: path
  #       credentials:
  #         type: static
  #         access_key_id: ${KRUN_OBJECT_STORAGE_ACCESS:-replace-me}
  #         secret_access_key: ${KRUN_OBJECT_STORAGE_SECRET:-replace-me}
  # 真实 TOS 改用主示例中的 tos_assume_role；没有 STS 权限时不会自动降级。
  # 省略 workers: 段时服务仍可启动，Workers 接口返回 WORKERS_NOT_CONFIGURED，控制台显示“Workers 未配置”。

# 完整 workers: 配置启用 reconcile_concurrency: 8。
