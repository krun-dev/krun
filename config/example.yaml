# 唯一服务端配置示例：复制本文件，在一份 YAML 中配置认证、Workers 和部署。
# 本地：mkdir -p .data && cp config/example.yaml .data/dev.yaml
# 在 .data/dev.yaml 中设置 development: true，将 listen/internal_listen 改为
# 127.0.0.1:8080 / 127.0.0.1:8081，public_url 改为 http://127.0.0.1:8080
# （使用 Vite 时为 http://127.0.0.1:5173），static_dir: dist，启用 local 登录。
# 不使用 Workers 时删除 workers:；需要 local-first 时配置 kubeconfig、集群可达的
# S3 runtime 地址，builder_mode: local 只用于可信仓库，validator_pool 与隧道一致。
# 生产或测试：复制到私有配置位置，保持 development: false，填写真实 HTTPS origin、
# 数据库、认证、镜像、网关、存储和密钥；不可将实际凭据提交到仓库。
# 多入口：在 gateways、domains、runtime_pools、network_profiles 分别添加条目，
# 使用 gateway 与 domain_selector/pool_selector 的 labels 将入口与运行池对应起来；
# 多网关时 deployment.console_gateway 指定控制台入口。
# 生产：development: false，public_url 使用真实 HTTPS origin。
# 本地：development: true 时，listen 和 internal_listen 必须使用回环 IP，如 127.0.0.1。
# Vite 本地入口可设 public_url: http://127.0.0.1:5173。
# 可选。Grafana 地址使用浏览器能访问的 URL，允许配置子路径。
# worker_metrics:
#   grafana_url: https://grafana.example.com
#   dashboard_uid: krun-worker-metrics
# 若不用 Vite、直接访问 Go 提供的静态前端，本地 public_url 改为 http://127.0.0.1:8080。
listen: 0.0.0.0:8080
# Workers runtime 的配置流、制品下载与 ACK 只监听此端口。启用下方 workers:
# 时必填；仅通过内部 Service/NetworkPolicy 暴露给 runtime，不得接入公网网关。
internal_listen: 0.0.0.0:8081
# 合并部署兼容开关：主端口把 /api/internal/workers/* 转发到本机 internal_listen。
# 默认 false；开启后仍校验 pool 凭据，并且内部监听器仍需正常启动。
merged_deployment: false
public_url: https://console.example.com
development: false
# 允许已登录用户创建组织并成为该组织管理员；设为 false 则仅系统管理员可创建。
organization_self_service: true
db: ${KRUN_DATABASE_URL}
# 生产控制台由 OSS/CDN 提供；Go 只接收 /api/*。
static_dir: ""
# 仅列出实际 CDN / 反向代理的源网段。未受信任来源的 X-Forwarded-For 会被忽略。
trusted_proxy_cidrs: []
# 可选。Go 直接提供控制台时设置 static_dir，并在 trusted_proxy_cidrs 中列出可信网关。
# domain_redirect:
#   ips: [198.51.100.10, 198.51.100.11]
#   target_url: https://console-internal.example.com

# 所有字符串可直接填写，或使用 ${NAME} / ${NAME:-默认值}；$$ 表示字面美元符号。
# db 示例：postgres://krun:密码@127.0.0.1:25432/krun_dev?sslmode=disable
# 下面可选 Secret 使用空默认值；未启用对应来源时不需要设置。

# 邮箱验证码登录使用的 SMTP；只有启用 type: email 时才需要配置。
smtp:
  host: smtp.example.com
  port: 587
  tls: starttls # starttls 默认 587；tls 默认 465；省略 port 时按 tls 决定。
  username: noreply@example.com
  password: ${KRUN_SMTP_PASSWORD:-}
  from: noreply@example.com
  # 无密码中继可同时省略 username / password。
  # tls: none 仅允许 development: true + loopback SMTP，供本地模拟邮件使用。

# 所有来源默认关闭，按需 enabled: true 并填写凭据。enabled 省略时默认启用。
# 禁用来源也会拒绝其已有 Session、CLI Session 和 API Key 的访问。
# id 用于回调路径 /api/auth/<id>/callback；source_id 是稳定身份命名空间，投入使用后不要改名。
# 默认认证成功后创建账号，无需 registration: jit；邀请注册可加 registration: invite_only。
providers:
  # 开发环境一键登录，无邮箱验证；生产必须保持禁用。
  - id: local
    source_id: local-development
    type: dev
    name: 本地开发登录
    enabled: false

  # 本地邮箱验证码登录，无密码；验证后不会自动加入组织或获得角色。
  - id: email
    source_id: local-email-main
    type: email
    name: 邮箱登录
    enabled: false

  # GitHub OAuth App。默认 scopes: [read:user]，可省略。
  - id: github
    source_id: github-main
    type: github
    name: GitHub
    enabled: false
    client_id: ${KRUN_GITHUB_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_GITHUB_SECRET:-}

  # GitLab.com 或自建 GitLab。默认 scopes: [read_user]。
  - id: gitlab
    source_id: gitlab-main
    type: gitlab
    name: GitLab
    enabled: false
    base_url: https://gitlab.com # 自建实例改为自己的 HTTPS origin。
    client_id: ${KRUN_GITLAB_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_GITLAB_SECRET:-}
    # scopes: [api] # 应用只允许 api，或还需项目 / 仓库 API 权限时显式填写。

  # 阿里云 IDaaS OAuth2 Web 应用；端点和字段按实际实例确认。
  - id: aliyun
    source_id: aliyun-main
    type: oauth2
    name: 阿里云 IDaaS
    enabled: false
    client_id: ${KRUN_ALIYUN_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_ALIYUN_SECRET:-}
    authorize_url: https://login.example.com/oauth/authorize
    token_url: https://login.example.com/oauth/token
    userinfo_url: https://login.example.com/api/bff/v1.2/oauth2/userinfo
    scopes: [read]
    token_client_auth: client_secret_post
    subject_path: data.sub
    name_path: data.nickname
    email_path: data.email
    userinfo:
      success:
        path: success
        equals: true

  # 通用 OIDC，例如公司 SSO / 阿里云 IDaaS OIDC。
  # issuer 填应用提供的 Issuer；默认 scopes: [openid, profile, email]。
  - id: company
    source_id: company-oidc-main
    type: oidc
    name: 公司 SSO
    enabled: false
    issuer: https://identity.example.com
    client_id: ${KRUN_OIDC_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_OIDC_SECRET:-}

  # 自定义 OAuth2：按上游协议设置用户信息映射与业务成功条件。
  # 默认 GET + Bearer Token；以下展示 POST / headers / query / body 的可选用法。
  - id: company-oauth
    source_id: company-oauth-main
    type: oauth2
    name: 公司 OAuth2
    enabled: false
    client_id: ${KRUN_COMPANY_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_COMPANY_SECRET:-}
    authorize_url: https://sso.example.com/oauth/authorize
    token_url: https://sso.example.com/oauth/token
    token_client_auth: client_secret_post # 也支持 client_secret_basic。
    authorize_params:
      prompt: select_account
    userinfo_url: https://sso.example.com/api/user
    scopes: [profile]
    subject_path: data.user.id
    name_path: data.user.display_name
    email_path: data.user.email
    userinfo:
      method: POST
      headers:
        Accept: application/json
      query:
        locale: zh-CN
      body:
        include_profile: true
      success:
        path: code
        equals: 0

# Workers 控制面。与认证配置放在同一个文件。
# 省略 workers: 段时服务仍可启动，但 Workers 接口返回 WORKERS_NOT_CONFIGURED，
# 控制台显示“Workers 未配置”。删除此段即可关闭 Workers。
workers:
  # 每个控制面副本与 Runtime Pod 都有独立的有界缓存；所有副本共用 PostgreSQL 主库。
  runtime_config:
    protocol: 2
    verify_millis: 5000
    cache_entries: 65536
    cache_bytes: 134217728
    read_concurrency: 32
    max_subscriptions: 65536
    max_connections: 1024
    frame_bytes: 262144
    resource_bytes: 4194304
    pod_cache_bytes: 67108864
    pod_cache_entries: 65536
    pod_cold_concurrency: 4
  gradual_asset_retention_seconds: 86400
  reconcile_concurrency: 8
  namespace: workers-mvp
  # 集群内可省略以下三项，默认使用 Pod service account。
  # 本地/集群外控制面可改用显式 kubeconfig；两种方式互斥，使用时删除下面三项。
  # kubernetes_kubeconfig_file: /absolute/path/to/kubeconfig
  # kubernetes_context: test-cluster # 省略时使用该文件的 current-context。
  # 不搜索 KUBECONFIG 或 ~/.kube/config；namespace 始终由上面的配置决定。
  kubernetes_api: https://kubernetes.default.svc
  kubernetes_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  kubernetes_ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  # local 仅允许 development: true，并且只用于可信仓库。
  builder_mode: kubernetes
  builder_image: krun-worker-builder:20261013
  builder_pull_policy: IfNotPresent
  # 生产多租户建议配置 gVisor/Kata 等 RuntimeClass；留空使用集群默认运行时。
  builder_runtime_class: ""
  builder_timeout_seconds: 600
  # 构建容器资源；缺省字段沿用下列默认值。直接上传构建使用 build 配置。
  builder_build_resources:
    requests: {cpu: "100m", memory: "256Mi", ephemeral-storage: "512Mi"}
    limits: {cpu: "2", memory: "2Gi", ephemeral-storage: "3Gi"}
  # 仓库构建在 build 完成后运行 pack。
  builder_pack_resources:
    requests: {cpu: "50m", memory: "128Mi", ephemeral-storage: "64Mi"}
    limits: {cpu: "1", memory: "512Mi", ephemeral-storage: "512Mi"}
  builder_node_selector: {}
  builder_tolerations: []
  # 默认 secret；env 模式用于不支持同步 Secret 的集群，短期授权 URL 会出现在 Pod 规格中。
  builder_input_mode: secret
  # 所有包管理器只允许从这个无凭据的 HTTPS registry / 代理安装依赖。
  npm_registry: https://registry.npmjs.org/
  # 网关实例清单。路由按域名所属的 gateway 分组下发：一个实例的路由表里只会有
  # 绑定到它的域名，别的域名即使伪造 Host 也匹配不到。base 仅用于本地调试（SSH
  # 隧道），生产留空即走 <name>.<namespace>.svc:8080。
  gateways:
    - id: external
      name: workers-public
      namespace: kgateway-system
      section: public
      base: ""
  # 域名清单，数量不限。access、labels、gateway 都是部署侧的匹配和路由元数据，
  # 不会返回给组织用户。label 是允许展示的域名备注。
  # default: true 的域名会被新建环境默认选中。
  domains:
    - id: public
      types: [worker_default, worker_custom]
      domain: workers.example.com
      label: 默认公网入口
      access: public
      labels:
        exposure: external
      gateway: external
      default: true
      # 静态资产域名，留空则取 static.<domain>。
      static_domain: static.workers.example.com
      reserved_hosts: []
  # 可选。可在 domains 列表追加专用后缀，并为它们配置通配 DNS 和 TLS。
  #   - id: custom
  #     types: [worker_custom]
  #     domain: custom.example.com
  #     access: public
  #     labels: {exposure: external}
  #     gateway: external
  #   - id: apps
  #     types: [application]
  #     domain: apps.example.com
  #     access: public
  #     labels: {exposure: external}
  #     gateway: external
  # 可选。把已部署的静态站点或 HTTP 服务登记为 Origin Rules 的目标。
  # managed_origins:
  #   - host: storefront.origin.example.com
  #     kind: static
  #     label: 商城前端
  #     service: storefront
  #     namespace: workers-mvp
  #     port: 80
  #     organizations: [replace-with-org-id]
  #     suffixes: [apps]
  # 资源池是部署侧的物理执行单元，组织用户看不到。一个网络档案可以匹配多个
  # pool；控制面使用稳定哈希选出 placement，并持久化选择结果。
  # 默认从业务 pool 的 Ready serving Pod 校验候选，不额外部署 validator。
  # 需要进程隔离时填一个 pool ID，所有业务 pool 共用该池的独立 validator。
  # 可选 HTTPS origin；留空使用控制面内部 Service，不含 /api/internal/workers 路径。
  # 这是部署方配置，会接收 pool 凭据；不得开放给 Worker 用户编辑。
  runtime_api_url: ""
  # 禁止业务访问的平台地址。公网可路由的管理地址也应显式列出。
  protected_egress_cidrs: []
  # local-first serving Pod 的 PostgreSQL NetworkPolicy 允许目标，填实际源库网段和 TCP 端口。
  # local_database_egress:
  #   - cidr: 192.0.2.0/24
  #     port: 5432
  # database_origin_ca_file: /absolute/path/to/database-ca.pem # 可选，供渲染 workerd 配置使用。
  validator_pool: ""
  runtime_pools:
    - id: public-a
      access: [public]
      labels:
        zone: external
      private_egress: deny
      public_egress: direct
      runtime_service: runtime-default
      # 可选。启用后可在系统配置中查看生成的 serving 清单。Secret 由部署方提供。
      # deployment:
      #   image: registry.example.com/krun/runtime:v1 # 省略时继承 deployment.runtime_image
      #   replicas: 2
      #   pod_labels: {team: runtime}
      #   config_map_annotations: {kubeocean.io/sync-to-physical: "true"}
      #   node_selector: {workload: runtime}
      #   tolerations:
      #     - {key: workload, operator: Equal, value: runtime, effect: NoSchedule}
      #   dns_policy: ClusterFirst
      #   dns_config:
      #     options: [{name: ndots, value: "2"}]
      #   secret_name: runtime-default
      # 仅当 validator_pool 选中此池时部署；不得与 runtime_service 相同。
      validator_service: runtime-validator-default
      runtime_token: ${KRUN_RUNTIME_TOKEN}
      # 省略 validator_token 时从 runtime_token 按 pool 派生，validator 只挂载派生凭据。
      management_token: ${KRUN_MANAGEMENT_TOKEN}
      default: true
      # 可选：执行池容量参数；省略时使用程序默认值。
      # execution:
      #   compute_processes: 2
      #   compute_hosts: []
      #   cpu_high_millicores: 750
      #   cpu_reserve_millicores: 1000
      #   memory_reserve_mib: 1639
      #   max_loaded_per_process: 650
      #   max_cold_in_flight: 4
      #   ordinary_in_flight: 32
      #   streams:
      #     sse_paths: []
      #     per_process: 300
      #     per_execution_pod: 600
      #     per_ingress_pod: 600
      #     per_peer: 128
      #   compute_in_flight: 2
      #   peer_ordinary_in_flight: 16
      #   peer_compute_in_flight: 4
      #   peer_cooldown_ms: 15
  # 组织用户只看到这里配置的产品档案名称和描述，不会看到 pool、access、selector
  # 或 Gateway。单一档案时控制台不显示选择器。
  network_profiles:
    - id: standard
      name: 标准网络
      description: 通过部署方提供的受管入口访问。
      domain_selector:
        exposure: external
      pool_selector:
        zone: external
      requirements:
        ingress: [public]
        private_egress: deny
        public_egress: direct
      approval: none
      visibility: public
      default: true
  preview_limit: 32
  # Worker Secret 使用 AES-256-GCM 加密后入库。active key 只用于新写入；
  # retained Release 仍引用旧版本时不要删除旧 key。生产值应由 KMS/密钥系统
  # 通过环境变量提供随机生成的 32 字节密钥，使用标准 Base64 编码。
  secrets_active_key: v1
  secrets_keys:
    v1: ${KRUN_WORKERS_SECRETS_KEY}
  artifact_storage:
    endpoint: https://s3.example.com
    # 可选地址覆盖，指向同一个桶。构建和日志默认使用 endpoint；
    # Runtime 默认使用 builder_endpoint，没有配置时也使用 endpoint。
    # builder_endpoint: https://s3.builder.internal.example.com
    # runtime_endpoint: https://s3.runtime.internal.example.com
    # log_read_endpoint: https://s3.public.example.com
    region: us-east-1
    addressing_style: auto # auto / path / virtual
    bucket: krun-artifacts
    bucket_mode: managed # managed 自动建桶，external 使用已有桶
    prefix: "" # 例如 dev/run，不带首尾斜杠
    location_id: primary
    credentials:
      mode: ak_sk
      access_key_id: ${KRUN_S3_ACCESS:-replace-me}
      secret_access_key: ${KRUN_S3_SECRET:-replace-me}
    # 火山 TOS 可改为 mode: sts、provider: volcengine，并添加 role_trn。
    # STS 模式使用已有桶、区域 HTTPS S3 地址、virtual 寻址和非空 prefix。
    # sts_endpoint 可省略，默认 https://sts.volcengineapi.com。
  # 可选业务存储凭据；与上面的制品/配置存储分开。真实密钥只放主配置或环境变量。
  # object_storage:
  #   default_store: primary
  #   cursor_key: ${KRUN_OBJECT_STORAGE_CURSOR_KEY}
  #   credential_ttl_seconds: 3600
  #   refresh_before_seconds: 300
  #   credential_cache_entries: 1024
  #   credential_concurrency: 8
  #   credential_timeout_seconds: 20
  #   request_timeout_seconds: 600
  #   stores:
  #     - id: primary
  #       endpoint: https://tos-s3-cn-beijing.volces.com
  #       region: cn-beijing
  #       bucket: example-worker-data
  #       root_prefix: worker-data/v1
  #       addressing_style: virtual
  #       # 可选：独立配置的私有回源 CDN；域名、SHA256 Type A 与有效期须在 CDN 侧一致。
  #       # delivery:
  #       #   type: volc_cdn_a
  #       #   base_url: https://files.example.com
  #       #   signing_key: ${KRUN_OBJECT_CDN_SIGNING_KEY:-replace-me}
  #       #   ttl_seconds: 300
  #       credentials:
  #         type: tos_assume_role
  #         access_key_id: ${KRUN_OBJECT_STORAGE_ACCESS:-replace-me}
  #         secret_access_key: ${KRUN_OBJECT_STORAGE_SECRET:-replace-me}
  #         role_trn: ${KRUN_OBJECT_STORAGE_ROLE:-trn:iam::1000000000:role/example}
  #         sts_endpoint: https://sts.volcengineapi.com
  # static 模式只填 type/access_key_id/secret_access_key，不具备云端会话限权。
  # 仓库构建会把代码 checkout 到这个目录。只读根文件系统时必须指向可写卷。
  clone_directory: /workdir
  repository_providers:
    - id: github
      type: github
      name: GitHub
      enabled: false
      priority: 10
      base_url: https://github.com
      client_id: ${KRUN_REPO_GITHUB_CLIENT_ID:-}
      client_secret: ${KRUN_REPO_GITHUB_CLIENT_SECRET:-}
      # Set the GitHub App slug to use its user authorization and selected repositories.
      github_app_slug: ${KRUN_REPO_GITHUB_APP_SLUG:-}
    - id: gitlab
      type: gitlab
      name: GitLab.com
      enabled: false
      priority: 20
      base_url: https://gitlab.com
      # 自建 GitLab 的 OAuth endpoint 若解析到私网地址，必须由管理员显式改为 true。
      allow_private_network: false
      client_id: ${KRUN_REPO_GITLAB_CLIENT_ID:-}
      client_secret: ${KRUN_REPO_GITLAB_CLIENT_SECRET:-}

# 公司集群部署的可选信息仍放在同一主配置；以下取消注释并填写真实值。
# deployment:
#   console_gateway: internal # 多网关时必须显式选择控制台入口，对应 gateways[].id。
#   control_image: registry.example.com/krun/krun-control:release-tag
#   runtime_image: registry.example.com/krun/krun-runtime:release-tag
#   dns_resolver: ${KRUN_CLUSTER_DNS:-192.0.2.53}
#   control_replicas: 1
#   runtime_replicas: 2
#   validator_replicas: 1
#   runtime_class: ""
#   image_pull_secrets: []
#   network:
#     control:
#       - cidrs: ["${KRUN_DATABASE_CIDR:-192.0.2.0/24}"]
#         ports: [5432]
#       - cidrs: ["${KRUN_KUBERNETES_API_CIDR:-198.51.100.0/24}"]
#         ports: [443, 6443]
#       - public_https: true
#     runtime:
#       - public_https: true
#     builder:
#       - public_https: true
