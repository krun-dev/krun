# 服务端配置总示例：复制后修改地址、数据库和需要启用的登录来源。
# 生产：development: false，listen 可绑定 0.0.0.0，public_url 使用真实 HTTPS origin。
# 本地：development: true，listen: 127.0.0.1:8080，public_url: http://127.0.0.1:5173。
# 若不用 Vite、直接访问 Go 提供的静态前端，本地 public_url 改为 http://127.0.0.1:8080。
listen: 0.0.0.0:8080
# Workers runtime 的配置流、制品下载与 ACK 只监听此端口。启用下方 workers:
# 时必填；仅通过内部 Service/NetworkPolicy 暴露给 runtime，不得接入公网网关。
internal_listen: 0.0.0.0:8081
public_url: https://console.example.com
development: false
# 允许任何已登录用户创建组织（默认 false：仅系统管理员）
organization_self_service: false
db: ${KRUN_DATABASE_URL}
# 生产控制台由 OSS/CDN 提供；Go 只接收 /api/*。
static_dir: ""
# 仅列出实际 CDN / 反向代理的源网段。未受信任来源的 X-Forwarded-For 会被忽略。
trusted_proxy_cidrs: []

# 所有字符串可直接填写，或使用 ${NAME} / ${NAME:-默认值}；$$ 表示字面美元符号。
# db 示例：postgres://krun:密码@127.0.0.1:25432/krun_dev?sslmode=disable
# 下面可选 Secret 使用空默认值；未启用对应来源时不需要设置。

# 邮箱验证码登录使用的 SMTP；只有启用 type: email 时才需要配置。
smtp:
  host: smtp.example.com
  port: 587
  tls: starttls # starttls 默认 587；tls 默认 465；省略 port 时按 tls 决定。
  username: noreply@example.com
  password: ${KRUN_SMTP_PASSWORD:-}
  from: noreply@example.com
  # 无密码中继可同时省略 username / password。
  # tls: none 仅允许 development: true + loopback SMTP，供本地模拟邮件使用。

# 所有来源默认关闭，按需 enabled: true 并填写凭据。enabled 省略时默认启用。
# 禁用来源也会拒绝其已有 Session、CLI Session 和 API Key 的访问。
# id 用于回调路径 /api/auth/<id>/callback；source_id 是稳定身份命名空间，投入使用后不要改名。
# 默认认证成功后创建账号，无需 registration: jit；邀请注册可加 registration: invite_only。
providers:
  # 开发环境一键登录，无邮箱验证；生产必须保持禁用。
  - id: local
    source_id: local-development
    type: dev
    name: 本地开发登录
    enabled: false

  # 本地邮箱验证码登录，无密码；验证后不会自动加入组织或获得角色。
  - id: email
    source_id: local-email-main
    type: email
    name: 邮箱登录
    enabled: false

  # GitHub OAuth App。默认 scopes: [read:user]，可省略。
  - id: github
    source_id: github-main
    type: github
    name: GitHub
    enabled: false
    client_id: ${KRUN_GITHUB_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_GITHUB_SECRET:-}

  # GitLab.com 或自建 GitLab。默认 scopes: [read_user]。
  - id: gitlab
    source_id: gitlab-main
    type: gitlab
    name: GitLab
    enabled: false
    base_url: https://gitlab.com # 自建实例改为自己的 HTTPS origin。
    client_id: ${KRUN_GITLAB_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_GITLAB_SECRET:-}
    # scopes: [api] # 应用只允许 api，或还需项目 / 仓库 API 权限时显式填写。

  # 阿里云 IDaaS 旧版 OAuth2 Web 应用；端点和字段按实际实例确认。
  - id: aliyun
    source_id: aliyun-main
    type: oauth2
    name: 阿里云 IDaaS
    enabled: false
    client_id: ${KRUN_ALIYUN_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_ALIYUN_SECRET:-}
    authorize_url: https://login.example.com/oauth/authorize
    token_url: https://login.example.com/oauth/token
    userinfo_url: https://login.example.com/api/bff/v1.2/oauth2/userinfo
    scopes: [read]
    token_client_auth: client_secret_post
    subject_path: data.sub
    name_path: data.nickname
    email_path: data.email
    userinfo:
      success:
        path: success
        equals: true

  # 通用 OIDC，例如公司 SSO / 阿里云 IDaaS OIDC。
  # issuer 填应用提供的 Issuer；默认 scopes: [openid, profile, email]。
  - id: company
    source_id: company-oidc-main
    type: oidc
    name: 公司 SSO
    enabled: false
    issuer: https://identity.example.com
    client_id: ${KRUN_OIDC_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_OIDC_SECRET:-}

  # 自定义 OAuth2：按上游协议设置用户信息映射与业务成功条件。
  # 默认 GET + Bearer Token；以下展示 POST / headers / query / body 的可选用法。
  - id: company-oauth
    source_id: company-oauth-main
    type: oauth2
    name: 公司 OAuth2
    enabled: false
    client_id: ${KRUN_COMPANY_CLIENT_ID:-replace-me}
    client_secret: ${KRUN_COMPANY_SECRET:-}
    authorize_url: https://sso.example.com/oauth/authorize
    token_url: https://sso.example.com/oauth/token
    token_client_auth: client_secret_post # 也支持 client_secret_basic。
    authorize_params:
      prompt: select_account
    userinfo_url: https://sso.example.com/api/user
    scopes: [profile]
    subject_path: data.user.id
    name_path: data.user.display_name
    email_path: data.user.email
    userinfo:
      method: POST
      headers:
        Accept: application/json
      query:
        locale: zh-CN
      body:
        include_profile: true
      success:
        path: code
        equals: 0

# Workers 控制面。与认证配置放在同一个文件。
# 省略 workers: 段时服务仍可启动，但 Workers 接口返回 WORKERS_NOT_CONFIGURED，
# 控制台显示“Workers 未配置”。删除此段即可关闭 Workers。
workers:
  namespace: workers-mvp
  # 集群内可省略以下三项，默认使用 Pod service account；local-first 开发
  # 在 .data/dev.yaml 中显式填写本机可达 API 与 .data/kind-creds 的绝对路径。
  kubernetes_api: https://kubernetes.default.svc
  kubernetes_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  kubernetes_ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  builder_image: krun-worker-builder:20261013
  builder_pull_policy: IfNotPresent
  runtime_service: runtime-default
  # 网关实例清单。路由按域名所属的 gateway 分组下发：一个实例的路由表里只会有
  # 绑定到它的域名，别的域名即使伪造 Host 也匹配不到。base 仅用于本地调试（SSH
  # 隧道），生产留空即走 <name>.<namespace>.svc:8080。
  gateways:
    - id: internal
      name: workers-mvp
      namespace: kgateway-system
      section: private
      base: ""
    - id: external
      name: workers-public
      namespace: kgateway-system
      section: public
      base: ""
  # 域名清单，数量不限。label 只是给人看的备注（公网/内网/办公网…），
  # 不参与任何路由判断；真正决定走哪个入口的是 gateway。
  # default: true 的域名会被新建环境默认选中。
  domains:
    - id: internal
      domain: workers.test
      label: 内网
      gateway: internal
      default: true
      # 静态资产域名，留空则取 static.<domain>。
      static_domain: static.workers.test
    - id: external
      domain: workers-out.example.com
      label: 公网
      gateway: external
      static_domain: static.workers-out.example.com
  preview_limit: 32
  runtime_token: ${KRUN_RUNTIME_TOKEN:-replace-with-a-24-plus-character-token}
  management_token: ${KRUN_MANAGEMENT_TOKEN:-replace-with-a-24-plus-character-token}
  s3_endpoint: https://s3.example.com
  # 可省略；分别用于 builder 上传和 runtime 下载时看到的同一个桶地址。
  s3_builder_endpoint: https://s3.builder.internal.example.com
  s3_runtime_endpoint: https://s3.runtime.internal.example.com
  s3_bucket: krun-artifacts
  s3_location_id: primary
  s3_access_key: ${KRUN_S3_ACCESS:-replace-me}
  s3_secret_key: ${KRUN_S3_SECRET:-replace-me}
  config_base_url: https://s3.internal.example.com/krun-artifacts/config
  # 仓库构建会把代码 checkout 到这个目录。只读根文件系统时必须指向可写卷。
  clone_directory: /workdir
  repository_providers:
    - id: github
      type: github
      name: GitHub
      enabled: false
      priority: 10
      base_url: https://github.com
      client_id: ${KRUN_REPO_GITHUB_CLIENT_ID:-}
      client_secret: ${KRUN_REPO_GITHUB_CLIENT_SECRET:-}
    - id: gitlab
      type: gitlab
      name: GitLab.com
      enabled: false
      priority: 20
      base_url: https://gitlab.com
      # 自建 GitLab 的 OAuth endpoint 若解析到私网地址，必须由管理员显式改为 true。
      allow_private_network: false
      client_id: ${KRUN_REPO_GITLAB_CLIENT_ID:-}
      client_secret: ${KRUN_REPO_GITLAB_CLIENT_SECRET:-}
