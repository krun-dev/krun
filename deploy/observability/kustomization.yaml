apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: krun-observability

resources:
  - namespace.yaml
  - victoria-metrics.yaml
  - vmagent.yaml
  - grafana.yaml

configMapGenerator:
  - name: vmagent-scrape
    files:
      - scrape.yaml
      - runtime-scrape.yaml
  - name: grafana-datasources
    files:
      - datasources.yaml
  - name: grafana-dashboards
    files:
      - dashboards.yaml
  - name: grafana-workers-runtime
    files:
      - workers-runtime.json
