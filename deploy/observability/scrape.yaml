global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]

  - job_name: victoria-metrics
    static_configs:
      - targets: ["victoria-metrics:8428"]

  - job_name: krun-kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [container]
        regex: workerd
        action: keep
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|spec_memory_limit_bytes)
        action: keep
