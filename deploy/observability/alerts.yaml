apiVersion: 1
groups:
  - orgId: 1
    name: krun Workers
    folder: krun
    interval: 30s
    rules:
      - uid: krun-runtime-config-not-converged
        title: krun Runtime 配置未收敛
        dashboardUid: krun-workers-runtime
        panelId: 12
        condition: B
        data:
          - refId: A
            datasourceUid: victoria-metrics
            relativeTimeRange: { from: 120, to: 0 }
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                (krun_runtime_config_converged{job="krun-worker-runtime"}
                and on(job, instance) (up{job="krun-worker-runtime"} == 1))
                or on(job, instance) (0 * up{job="krun-worker-runtime"})
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: math
              expression: '$A < 1'
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: Serving Pod 持续未确认当前配置，或指标采集失败
        labels:
          component: runtime-config
      - uid: krun-worker-ingress-unreachable
        title: krun Worker 入口探测失败
        dashboardUid: krun-workers-runtime
        panelId: 13
        condition: B
        data:
          - refId: A
            datasourceUid: victoria-metrics
            relativeTimeRange: { from: 120, to: 0 }
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                (probe_success{job="krun-worker-ingress"}
                and on(job, instance) (up{job="krun-worker-ingress"} == 1))
                or on(job, instance) (0 * up{job="krun-worker-ingress"})
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: math
              expression: '$A < 1'
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 业务 HTTPS 探测失败，或探测器无法采集
        labels:
          component: worker-ingress
