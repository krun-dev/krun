apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krun-observability-vmagent
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krun-observability-vmagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krun-observability-vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: krun-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmagent
    spec:
      serviceAccountName: vmagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.156.0
          args:
            - -promscrape.config=/etc/vmagent/scrape.yaml
            - -remoteWrite.url=http://victoria-metrics:8428/api/v1/write
            - -remoteWrite.tmpDataPath=/queue
            - -remoteWrite.maxDiskUsagePerURL=550MiB
          ports:
            - name: http
              containerPort: 8429
          readinessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: scrape
              mountPath: /etc/vmagent
              readOnly: true
            - name: queue
              mountPath: /queue
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.28.0
          args:
            - --config.file=/etc/krun-blackbox/blackbox.yaml
            - --web.listen-address=127.0.0.1:9115
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: probe
              mountPath: /etc/krun-blackbox
              readOnly: true
      volumes:
        - name: scrape
          configMap:
            name: vmagent-scrape
        - name: queue
          emptyDir:
            sizeLimit: 1Gi
        - name: probe
          configMap:
            name: vmagent-probe
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmagent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  policyTypes: [Ingress]
