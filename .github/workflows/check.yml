name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: krun_test
          POSTGRES_USER: krun
          POSTGRES_PASSWORD: krun_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U krun -d krun_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:permissions
      - run: npm run test:i18n
      - run: npm run build
      - run: go vet ./...
      - run: go test -race ./...
        env:
          KRUN_TEST_POSTGRES_URL: postgres://krun:krun_test@127.0.0.1:5432/krun_test?sslmode=disable
      - run: go build ./cmd/krun ./cmd/krun-server
