[package]
name = "krun-runtime-supervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
httparse = "1"
getrandom = "0.3"
libc = "0.2"
pingora-core = { version = "=0.9.1", default-features = false }
pingora-http = "=0.9.1"
pingora-proxy = { version = "=0.9.1", default-features = false }
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "time", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
