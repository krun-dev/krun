[package]
name = "krun-execution-pool-experiment"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
httparse = "1"
libc = "0.2"
pingora-core = { version = "=0.9.1", default-features = false }
pingora-http = "=0.9.1"
pingora-proxy = { version = "=0.9.1", default-features = false }
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "time", "rt"] }
